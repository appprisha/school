
<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <video id="myVideo" 
               src="vid1.mp4" 
               autoplay 
               loop 
               muted 
               playsinline 
               preload="auto">
        </video>
      </a-assets>
      
      <a-video src="#myVideo" 
               position="0 2 -4" 
               width="6" 
               height="3.5">
      </a-video>
    </a-scene>

    <script>
      window.onload = () => {
        const video = document.querySelector("#myVideo"); 
        video.play().catch(e => console.log(e));
      };
    </script>
  </body>
</html>
