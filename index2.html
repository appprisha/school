<!DOCTYPE html>
<html>
<head>
    <title>A-Frame 3D Shapes</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body>
    <!-- 3D Scene -->
    <a-scene>

        <!-- Camera and Lighting -->
        <a-entity light="type: ambient; intensity: 1"></a-entity>
        <a-entity light="type: directional; intensity: 1"
                  position="1 3 2"></a-entity>

        <!-- Box -->
        <a-box position="-3 1 -5"
               color="red"
               rotation="0 45 0">
        </a-box>

        <!-- Sphere -->
        <a-sphere position="-1 1 -5"
                  radius="0.8"
                  color="blue">
        </a-sphere>

        <!-- Cylinder -->
        <a-cylinder position="1 1 -5"
                    radius="0.5"
                    height="2"
                    color="green">
        </a-cylinder>

        <!-- Plane (Ground) -->
        <a-plane position="0 0 -5"
                 rotation="-90 0 0"
                 width="12"
                 height="8"
                 color="lightgray">
        </a-plane>

        <!-- Background -->
        <a-sky color="#87CEEB"></a-sky>

    </a-scene>
</body>
</html>
